<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lightning Bug - Performance Benchmarks</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --card-bg: #16213e;
            --text-color: #e4e4e4;
            --accent-color: #0f3460;
            --success-color: #00d26a;
            --warning-color: #ffd93d;
            --error-color: #ff6b6b;
            --border-color: #2a2a4a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: #fff;
        }

        .subtitle {
            color: #888;
            margin-bottom: 2rem;
        }

        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        button {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: #1a4980;
        }

        .btn-secondary {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background-color: var(--border-color);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 1rem;
            background-color: var(--card-bg);
            border-radius: 8px;
            margin-bottom: 2rem;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: var(--warning-color);
        }

        .status-indicator.running {
            background-color: var(--warning-color);
            animation: pulse 1s infinite;
        }

        .status-indicator.complete {
            background-color: var(--success-color);
        }

        .status-indicator.idle {
            background-color: #555;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1rem;
        }

        .result-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 1.25rem;
            border: 1px solid var(--border-color);
        }

        .result-card h3 {
            font-size: 1rem;
            margin-bottom: 0.75rem;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge {
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-weight: normal;
        }

        .badge.pass {
            background-color: var(--success-color);
            color: #000;
        }

        .badge.fail {
            background-color: var(--error-color);
            color: #fff;
        }

        .metrics {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.5rem;
        }

        .metric {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem;
            background-color: var(--accent-color);
            border-radius: 4px;
            font-size: 0.875rem;
        }

        .metric-label {
            color: #aaa;
        }

        .metric-value {
            font-family: 'SF Mono', Monaco, monospace;
            color: #fff;
        }

        .progress-bar {
            height: 4px;
            background-color: var(--border-color);
            border-radius: 2px;
            margin-top: 1rem;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--success-color);
            transition: width 0.3s ease;
        }

        #log {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 1rem;
            margin-top: 2rem;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 0.875rem;
            border: 1px solid var(--border-color);
        }

        .log-entry {
            padding: 0.25rem 0;
            border-bottom: 1px solid var(--border-color);
        }

        .log-entry:last-child {
            border-bottom: none;
        }

        .log-time {
            color: #666;
            margin-right: 0.5rem;
        }

        .log-info { color: #64b5f6; }
        .log-success { color: var(--success-color); }
        .log-warn { color: var(--warning-color); }
        .log-error { color: var(--error-color); }

        .environment {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 2rem;
            border: 1px solid var(--border-color);
        }

        .env-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .env-item {
            font-size: 0.875rem;
        }

        .env-label {
            color: #888;
        }

        .env-value {
            color: #fff;
            font-family: 'SF Mono', Monaco, monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Lightning Bug Benchmarks</h1>
        <p class="subtitle">Performance testing suite for the ClojureScript editor</p>

        <div class="environment">
            <strong>Environment</strong>
            <div class="env-grid" id="env-info">
                <div class="env-item">
                    <span class="env-label">Platform:</span>
                    <span class="env-value" id="env-platform">-</span>
                </div>
                <div class="env-item">
                    <span class="env-label">CPU Cores:</span>
                    <span class="env-value" id="env-cores">-</span>
                </div>
                <div class="env-item">
                    <span class="env-label">Memory:</span>
                    <span class="env-value" id="env-memory">-</span>
                </div>
                <div class="env-item">
                    <span class="env-label">User Agent:</span>
                    <span class="env-value" id="env-ua">-</span>
                </div>
            </div>
        </div>

        <div class="controls">
            <button id="run-btn" class="btn-primary" onclick="runBenchmarks()">
                Run Full Suite
            </button>
            <button id="quick-btn" class="btn-secondary" onclick="runQuickTest()">
                Quick Test
            </button>
            <button id="scroll-btn" class="btn-secondary" onclick="runScrollBenchmark()">
                Scroll Benchmark (EXP-005)
            </button>
            <button id="export-btn" class="btn-secondary" onclick="exportResults()" disabled>
                Export Results
            </button>
        </div>

        <div class="status">
            <div class="status-indicator idle" id="status-indicator"></div>
            <span id="status-text">Ready to run benchmarks</span>
        </div>

        <div class="results-grid" id="results">
            <!-- Results will be populated here -->
        </div>

        <div id="log">
            <div class="log-entry">
                <span class="log-time">[--:--:--]</span>
                <span class="log-info">Benchmark suite loaded. Click "Run Full Suite" to begin.</span>
            </div>
        </div>
    </div>

    <script>
        // Environment info
        document.getElementById('env-platform').textContent = navigator.platform || 'Unknown';
        document.getElementById('env-cores').textContent = navigator.hardwareConcurrency || 'Unknown';
        document.getElementById('env-memory').textContent = navigator.deviceMemory ? `${navigator.deviceMemory} GB` : 'Unknown';
        document.getElementById('env-ua').textContent = navigator.userAgent.substring(0, 50) + '...';

        function log(message, level = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            const time = new Date().toTimeString().split(' ')[0];
            entry.innerHTML = `<span class="log-time">[${time}]</span><span class="log-${level}">${message}</span>`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function setStatus(text, state) {
            document.getElementById('status-text').textContent = text;
            const indicator = document.getElementById('status-indicator');
            indicator.className = 'status-indicator ' + state;
        }

        function formatMs(ms) {
            return ms.toFixed(3) + ' ms';
        }

        function renderResults(results) {
            const container = document.getElementById('results');
            container.innerHTML = '';

            if (!results || !results.benchmarks) {
                log('No results to display', 'warn');
                return;
            }

            for (const bench of results.benchmarks) {
                const stats = bench.cleaned?.stats || bench.raw?.stats;
                if (!stats) continue;

                const card = document.createElement('div');
                card.className = 'result-card';

                const passesTarget = bench.passes_target_QMARK_ || bench['passes-target?'];
                const target = bench.target;
                const badgeHtml = target
                    ? `<span class="badge ${passesTarget ? 'pass' : 'fail'}">${passesTarget ? 'PASS' : 'FAIL'}</span>`
                    : '';

                card.innerHTML = `
                    <h3>
                        ${bench.name}
                        ${badgeHtml}
                    </h3>
                    <div class="metrics">
                        <div class="metric">
                            <span class="metric-label">Mean</span>
                            <span class="metric-value">${formatMs(stats.mean)}</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Median</span>
                            <span class="metric-value">${formatMs(stats.median)}</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">P95</span>
                            <span class="metric-value">${formatMs(stats.p95)}</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">P99</span>
                            <span class="metric-value">${formatMs(stats.p99)}</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Std Dev</span>
                            <span class="metric-value">${formatMs(stats['std-dev'] || stats.stdDev || 0)}</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Samples</span>
                            <span class="metric-value">${stats.count}</span>
                        </div>
                    </div>
                    ${target ? `
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${Math.min(100, (target['target-ms'] / stats.p95) * 100)}%"></div>
                    </div>
                    ` : ''}
                `;

                container.appendChild(card);
            }

            document.getElementById('export-btn').disabled = false;
        }

        let currentResults = null;

        async function runBenchmarks() {
            const runBtn = document.getElementById('run-btn');
            const quickBtn = document.getElementById('quick-btn');
            const scrollBtn = document.getElementById('scroll-btn');
            runBtn.disabled = true;
            quickBtn.disabled = true;
            scrollBtn.disabled = true;

            setStatus('Running benchmarks...', 'running');
            log('Starting full benchmark suite...', 'info');

            try {
                // Wait for ClojureScript to be loaded
                if (typeof lib === 'undefined' || typeof lib.perf === 'undefined') {
                    throw new Error('Benchmark module not loaded. Please wait for compilation.');
                }

                const result = await lib.perf.benchmark_tests.runBenchmarks();
                currentResults = result;
                renderResults(result);
                setStatus('Benchmarks complete!', 'complete');
                log('All benchmarks completed successfully', 'success');
            } catch (error) {
                setStatus('Error running benchmarks', 'idle');
                log('Error: ' + error.message, 'error');
                console.error(error);
            } finally {
                runBtn.disabled = false;
                quickBtn.disabled = false;
                scrollBtn.disabled = false;
            }
        }

        async function runQuickTest() {
            const runBtn = document.getElementById('run-btn');
            const quickBtn = document.getElementById('quick-btn');
            const scrollBtn = document.getElementById('scroll-btn');
            runBtn.disabled = true;
            quickBtn.disabled = true;
            scrollBtn.disabled = true;

            setStatus('Running quick test...', 'running');
            log('Starting quick benchmark test...', 'info');

            try {
                if (typeof lib === 'undefined' || typeof lib.perf === 'undefined') {
                    throw new Error('Benchmark module not loaded. Please wait for compilation.');
                }

                const result = await lib.perf.benchmark_tests.runQuickTest();
                currentResults = result;
                renderResults(result);
                setStatus('Quick test complete!', 'complete');
                log('Quick test completed', 'success');
            } catch (error) {
                setStatus('Error running quick test', 'idle');
                log('Error: ' + error.message, 'error');
                console.error(error);
            } finally {
                runBtn.disabled = false;
                quickBtn.disabled = false;
                scrollBtn.disabled = false;
            }
        }

        function formatPercent(ratio) {
            return (ratio * 100).toFixed(1) + '%';
        }

        function renderScrollResults(result) {
            const container = document.getElementById('results');
            container.innerHTML = '';

            if (result.status === 'skipped') {
                const card = document.createElement('div');
                card.className = 'result-card';
                card.innerHTML = `
                    <h3>Scroll Performance (EXP-005) <span class="badge fail">SKIPPED</span></h3>
                    <div class="metrics">
                        <div class="metric" style="grid-column: span 2;">
                            <span class="metric-label">Reason</span>
                            <span class="metric-value">${result.reason || 'Unknown'}</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
                return;
            }

            const card = document.createElement('div');
            card.className = 'result-card';

            const hitRatio = result['cache-hit-ratio'] || result.cacheHitRatio || 0;
            const isGoodHitRatio = hitRatio >= 0.5;

            card.innerHTML = `
                <h3>
                    Scroll Performance (EXP-005)
                    <span class="badge ${isGoodHitRatio ? 'pass' : 'fail'}">${isGoodHitRatio ? 'PASS' : 'REVIEW'}</span>
                </h3>
                <div class="metrics">
                    <div class="metric">
                        <span class="metric-label">Mean Frame Time</span>
                        <span class="metric-value">${formatMs(result['mean-frame-time-ms'] || result.meanFrameTimeMs || 0)}</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">P95 Frame Time</span>
                        <span class="metric-value">${formatMs(result['p95-frame-time-ms'] || result.p95FrameTimeMs || 0)}</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Cache Hits</span>
                        <span class="metric-value">${result['cache-hits'] || result.cacheHits || 0}</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Cache Misses</span>
                        <span class="metric-value">${result['cache-misses'] || result.cacheMisses || 0}</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Cache Hit Ratio</span>
                        <span class="metric-value">${formatPercent(hitRatio)}</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Scroll Count</span>
                        <span class="metric-value">${result['scroll-count'] || result.scrollCount || 0}</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Total Rebuilds</span>
                        <span class="metric-value">${result['total-rebuilds'] || result.totalRebuilds || 0}</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Total Queries</span>
                        <span class="metric-value">${result['total-queries'] || result.totalQueries || 0}</span>
                    </div>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${hitRatio * 100}%; background-color: ${isGoodHitRatio ? 'var(--success-color)' : 'var(--warning-color)'}"></div>
                </div>
            `;

            container.appendChild(card);
            document.getElementById('export-btn').disabled = false;
        }

        async function runScrollBenchmark() {
            const runBtn = document.getElementById('run-btn');
            const quickBtn = document.getElementById('quick-btn');
            const scrollBtn = document.getElementById('scroll-btn');
            runBtn.disabled = true;
            quickBtn.disabled = true;
            scrollBtn.disabled = true;

            setStatus('Running scroll benchmark (EXP-005)...', 'running');
            log('Starting scroll performance benchmark...', 'info');
            log('This benchmark validates viewport-aware highlight caching.', 'info');

            try {
                if (typeof lib === 'undefined' || typeof lib.perf === 'undefined') {
                    throw new Error('Benchmark module not loaded. Please wait for compilation.');
                }

                const result = await lib.perf.benchmark_tests.runScrollBenchmark();
                currentResults = { scrollBenchmark: result };
                renderScrollResults(result);

                if (result.status === 'skipped') {
                    setStatus('Scroll benchmark skipped (WASM not available)', 'idle');
                    log('Scroll benchmark skipped: ' + (result.reason || 'WASM files not available'), 'warn');
                } else {
                    const hitRatio = result['cache-hit-ratio'] || result.cacheHitRatio || 0;
                    setStatus(`Scroll benchmark complete! Cache hit ratio: ${formatPercent(hitRatio)}`, 'complete');
                    log(`Cache hits: ${result['cache-hits'] || result.cacheHits}, misses: ${result['cache-misses'] || result.cacheMisses}`, 'success');
                    log(`Mean frame time: ${formatMs(result['mean-frame-time-ms'] || result.meanFrameTimeMs || 0)}`, 'success');
                }
            } catch (error) {
                setStatus('Error running scroll benchmark', 'idle');
                log('Error: ' + error.message, 'error');
                console.error(error);
            } finally {
                runBtn.disabled = false;
                quickBtn.disabled = false;
                scrollBtn.disabled = false;
            }
        }

        function exportResults() {
            if (!currentResults) {
                log('No results to export', 'warn');
                return;
            }

            try {
                const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
                const filename = `benchmark-${timestamp}.json`;
                const json = JSON.stringify(currentResults, null, 2);
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.click();
                URL.revokeObjectURL(url);
                log(`Results exported to ${filename}`, 'success');
            } catch (error) {
                log('Error exporting results: ' + error.message, 'error');
            }
        }
    </script>
    <script src="/js/main.js"></script>
</body>
</html>
