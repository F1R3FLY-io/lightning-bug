<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="675px" preserveAspectRatio="none" style="width:350px;height:675px;background:#FFFFFF;" version="1.1" viewBox="0 0 350 675" width="350px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><ellipse cx="159.7939" cy="25" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#D6E4F0" height="69.0323" rx="12.5" ry="12.5" style="stroke:#2C5F8A;stroke-width:0.5;" width="200.1813" x="59.7032" y="55"/><text fill="#10223A" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="122.4129" x="69.7032" y="77.8281">Formulate hypothesis</text><text fill="#10223A" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="180.1813" x="69.7032" y="94.1722">(target metric + expected effect,</text><text fill="#10223A" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="61.3444" x="69.7032" y="110.5163">quantified)</text><rect fill="#D6E4F0" height="52.6882" rx="12.5" ry="12.5" style="stroke:#2C5F8A;stroke-width:0.5;" width="168.093" x="75.7473" y="144.0323"/><text fill="#10223A" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="148.093" x="85.7473" y="166.8604">Create experiment branch</text><text fill="#10223A" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="141.385" x="85.7473" y="183.2045">from a captured baseline</text><rect fill="#D6E4F0" height="52.6882" rx="12.5" ry="12.5" style="stroke:#2C5F8A;stroke-width:0.5;" width="177.8851" x="70.8513" y="216.7206"/><text fill="#10223A" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="157.8851" x="80.8513" y="239.5487">Implement the optimization</text><text fill="#10223A" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="148.417" x="80.8513" y="255.8928">(minimal, isolated change)</text><rect fill="#D6E4F0" height="52.6882" rx="12.5" ry="12.5" style="stroke:#2C5F8A;stroke-width:0.5;" width="270.8004" x="24.3937" y="289.4088"/><text fill="#10223A" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="95.2207" x="34.3937" y="312.2369">Run benchmarks</text><text fill="#10223A" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="250.8004" x="34.3937" y="328.581">(&#8805;30 samples, warmup, IQR outlier removal)</text><rect fill="#D6E4F0" height="52.6882" rx="12.5" ry="12.5" style="stroke:#2C5F8A;stroke-width:0.5;" width="182.8772" x="68.3553" y="362.097"/><text fill="#10223A" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="101.6527" x="78.3553" y="384.9251">Statistical analysis</text><text fill="#10223A" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="162.8772" x="78.3553" y="401.2692">Welch's t &#183; Cohen's d &#183; 95% CI</text><polygon fill="#F5E0C3" points="97.3864,434.7853,222.2013,434.7853,234.2013,449.7671,222.2013,464.749,97.3864,464.749,85.3864,449.7671,97.3864,434.7853" style="stroke:#B5791F;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#10223A" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="124.815" x="97.3864" y="446.5442">p &lt; 0.05  AND  |d| &#8805; 0.2</text><text fill="#10223A" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="107.7222" x="97.3864" y="461.5261">AND no regressions?</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="17.0829" x="68.3035" y="446.5442">yes</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="13.4529" x="234.2013" y="446.5442">no</text><rect fill="#D6E4F0" height="36.3441" rx="12.5" ry="12.5" style="stroke:#2C5F8A;stroke-width:0.5;" width="118.7727" x="16" y="474.749"/><text fill="#10223A" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="98.7727" x="26" y="497.5771">ACCEPT &#8212; merge</text><rect fill="#D6E4F0" height="36.3441" rx="12.5" ry="12.5" style="stroke:#2C5F8A;stroke-width:0.5;" width="172.6771" x="157.8628" y="474.749"/><text fill="#10223A" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="152.6771" x="167.8628" y="497.5771">REJECT &#8212; keep as evidence</text><polygon fill="#F5E0C3" points="159.7939,517.0931,171.7939,529.0931,159.7939,541.0931,147.7939,529.0931,159.7939,517.0931" style="stroke:#B5791F;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect fill="#D6E4F0" height="52.6882" rx="12.5" ry="12.5" style="stroke:#2C5F8A;stroke-width:0.5;" width="275.9258" x="21.8309" y="561.0931"/><text fill="#10223A" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="170.2092" x="31.8309" y="583.9212">Document result in an EXP log</text><text fill="#10223A" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="255.9258" x="31.8309" y="600.2654">(hypothesis, change, result, decision, lessons)</text><ellipse cx="159.7939" cy="644.7814" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="159.7939" cy="644.7814" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#555555;stroke-width:1;" x1="159.7939" x2="159.7939" y1="35" y2="55"/><polygon fill="#555555" points="155.7939,45,159.7939,55,163.7939,45,159.7939,49" style="stroke:#555555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#555555;stroke-width:1;" x1="159.7939" x2="159.7939" y1="124.0323" y2="144.0323"/><polygon fill="#555555" points="155.7939,134.0323,159.7939,144.0323,163.7939,134.0323,159.7939,138.0323" style="stroke:#555555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#555555;stroke-width:1;" x1="159.7939" x2="159.7939" y1="196.7206" y2="216.7206"/><polygon fill="#555555" points="155.7939,206.7206,159.7939,216.7206,163.7939,