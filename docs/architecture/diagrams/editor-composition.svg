<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="901px" preserveAspectRatio="none" style="width:1188px;height:901px;background:#FFFFFF;" version="1.1" viewBox="0 0 1188 901" width="1188px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><!--cluster core--><g class="cluster" data-qualified-name="core" data-source-line="11" id="ent0001"><rect fill="#4F86C6" height="720.02" rx="5" ry="5" style="stroke:#333333;stroke-width:1;" width="372" x="7" y="7"/><text fill="#10223A" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="302.8468" x="41.5766" y="23.9659">lib.core  (React forwardRef shell, ~291 lines)</text></g><!--entity step1--><g class="entity" data-qualified-name="core.step1" data-source-line="12" id="ent0002"><rect fill="#D6E4F0" height="58.1358" rx="5" ry="5" style="stroke:#333333;stroke-width:0.5;" width="234.3782" x="90.81" y="45"/><text fill="#10223A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="141.9734" x="100.81" y="69.9659">1. Resolve Workspace</text><text fill="#10223A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="214.3782" x="100.81" y="89.0339">prop &#8594; context &#8594; shared default</text></g><!--entity step2--><g class="entity" data-qualified-name="core.step2" data-source-line="13" id="ent0003"><rect fill="#D6E4F0" height="58.1358" rx="5" ry="5" style="stroke:#333333;stroke-width:0.5;" width="193.9633" x="111.02" y="164.13"/><text fill="#10223A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="155.7914" x="121.02" y="189.0959">2. Per-editor state atom</text><text fill="#10223A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="173.9633" x="121.02" y="208.1639">(reagent atom in a useRef)</text></g><!--entity step3--><g class="entity" data-qualified-name="core.step3" data-source-line="14" id="ent0004"><rect fill="#D6E4F0" height="96.2717" rx="5" ry="5" style="stroke:#333333;stroke-width:0.5;" width="297.1149" x="59.44" y="283.27"/><text fill="#10223A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="156.1694" x="69.44" y="308.2359">3. useMemo singletons:</text><text fill="#10223A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="208.2912" x="69.44" y="327.3039">events (ReplaySubject), pane-id,</text><text fill="#10223A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="277.1149" x="69.44" y="346.3718">client (ConnectionManager), lifecycle-mgr,</text><text fill="#10223A" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="68.3477" x="69.44" y="365.4397">editor-ctx</text><text fill="#10223A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="133.7555" x="137.7877" y="365.4397">, container/view refs</text></g><!--entity step4--><g class="entity" data-qualified-name="core.step4" data-source-line="15" id="ent0005"><rect fill="#D6E4F0" height="63.5838" rx="5" ry="5" style="stroke:#333333;stroke-width:0.5;" width="339.372" x="23.31" y="465.35"/><text fill="#10223A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="157.3034" x="33.31" y="490.3159">4. useImperativeHandle</text><text fill="#10223A" font-family="Helvetica" font-size="18" font-weight="700" lengthAdjust="spacing" textLength="319.372" x="33.31" y="513.6598">commands/build-handle(ctx, ready)</text></g><!--entity step5--><g class="entity" data-qualified-name="core.step5" data-source-line="16" id="ent0006"><rect fill="#D6E4F0" height="96.2717" rx="5" ry="5" style="stroke:#333333;stroke-width:0.5;" width="260.9811" x="80.51" y="614.74"/><text fill="#10223A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="103.5156" x="90.51" y="639.7059">5. Mount effect:</text><text fill="#10223A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="188.7753" x="90.51" y="658.7739">build EditorState/EditorView,</text><text fill="#10223A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="240.9811" x="90.51" y="677.8418">subscribe events, register resources,</text><text fill="#10223A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="78.4417" x="90.51" y="696.9097">emit `ready`</text></g><!--entity ctx--><g class="entity" data-qualified-name="ctx" data-source-line="19" id="ent0007"><rect fill="#B9C2CE" height="77.2038" rx="5" ry="5" style="stroke:#333333;stroke-width:0.5;" width="304.2549" x="475.87" y="458.54"/><text fill="#10223A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.2549" x="485.87" y="483.5059">editor-ctx  (immutable dependency bundle)</text><text fill="#10223A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="255.401" x="485.87" y="502.5739">{state-atom view-ref events client conn</text><text fill="#10223A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="190.7633" x="489.51" y="521.6418">workspace pane-id lsp-atom}</text></g><!--entity cmds--><g class="entity" data-qualified-name="cmds" data-source-line="21" id="ent0008"><rect fill="#6FB2B0" height="58.1358" rx="5" ry="5" style="stroke:#333333;stroke-width:0.5;" width="242.1216" x="394.94" y="633.81"/><text fill="#10223A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="135.9535" x="404.94" y="658.7759">lib.editor.commands</text><text fill="#10223A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="222.1216" x="404.94" y="677.8439">build-handle &#8594; 28-method ref API</text></g><!--entity rt--><g class="entity" data-qualified-name="rt" data-source-line="22" id="ent0009"><rect fill="#6FB2B0" height="77.2038" rx="5" ry="5" style="stroke:#333333;stroke-width:0.5;" width="297.1149" x="399.44" y="810.02"/><text fill="#10223A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="115.4996" x="409.44" y="834.9859">lib.editor.runtime</text><text fill="#10223A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="238.3491" x="409.44" y="854.0539">get-extensions &#183; activate-document &#183;</text><text fill="#10223A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="277.1149" x="409.44" y="873.1218">ensure-lsp-document-opened &#183; emit-event</text></g><g class="entity" data-qualified-name="GMN18" data-source-line="34" id="ent0019"><path d="M858.72,636.32 L858.72,689.438 A5,5 0 0 0 863.72,694.438 L1168.2732,694.438 A5,5 0 0 0 1173.2732,689.438 L1173.2732,641.32 L1163.2732,631.32 L946.42,631.32 L717.99,536.12 L938.42,631.32 L863.72,631.32 A5,5 0 0 0 858.72,636.32" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1163.2732,631.32 L1163.2732,638.82 A2.5,2.5 0 0 0 1165.7732,641.32 L1173.2732,641.32 L1163.2732,631.32" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="269.4772" x="864.72" y="650.217">One dependency vocabulary shared by both</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="293.5532" x="864.72" y="667.923">extracted namespaces &#8212; neither touches React,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="220.1812" x="864.72" y="685.629">only ctx. This is the extraction seam.</text></g><!--link step1 to step2--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="24" id="lnk10"><path d="M208,103.42 C208,121.7 208,140.39 208,158.7" fill="none" id="step1-to-step2" style="stroke:#555555;stroke-width:1;"/><polygon fill="#555555" points="208,163.7,212,154.7,208,158.7,204,154.7,208,163.7" style="stroke:#555555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link step2 to step3--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="25" id="lnk11"><path d="M208,222.75 C208,240.15 208,257.81 208,277.86" fill="none" id="step2-to-step3" style="stroke:#555555;stroke-width:1;"/><polygon fill="#555555" points="208,282.86,212,273.86,208,277.86,204,273.86,208,282.86" style="stroke:#555555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link step3 to step4--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="26" id="lnk12"><path d="M203.66,379.76 C201.15,407.16 198.527,435.8709 196.317,459.9509" fill="none" id="step3-to-step4" style="stroke:#555555;stroke-width:1;"/><polygon fill="#555555" points="195.86,464.93,200.6658,456.3332,196.317,459.9509,192.6993,455.6021,195.86,464.93" style="stroke:#555555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link step4 to step5--><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" data-link-type="dependency" data-source-line="27" id="lnk13"><path d="M196.43,529.33 C199.07,553.36 202.2234,582.03 205.2334,609.4" fill="none" id="step4-to-step5" style="stroke:#555555;stroke-width:1;"/><polygon fill="#555555" points="205.78,614.37,208.7722,604.9867,205.2334,609.4,200.8201,605.8612,205.78,614.37" style="stroke:#555555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link step3 to ctx--><g class="link" data-entity-1="ent0004" data-entity-2="ent0007" data-link-type="dependency" data-source-line="28" id="lnk14"><path d="M330.05,379.98 C393.74,404.82 465.9615,432.9737 525.6715,456.2537" fill="none" id="step3-to-ctx" style="stroke:#555555;stroke-width:1;"/><polygon fill="#555555" points="530.33,458.07,523.3978,451.074,525.6715,456.2537,520.4918,458.5275,530.33,458.07" style="stroke:#555555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="36.959" x="444.15" y="424.437">builds</text></g><!--link ctx to cmds--><g class="link" data-entity-1="ent0007" data-entity-2="ent0008" data-link-type="dependency" data-source-line="29" id="lnk15"><path d="M566.95,536.24 C556.76,544.88 547.18,554.79 540,565.74 C526.7,586.03 521.4161,608.1719 518.7761,628.4319" fill="none" id="ctx-to-cmds" style="stroke:#555555;stroke-width:1;"/><polygon fill="#555555" points="518.13,633.39,523.2594,624.9823,518.7761,628.4319,515.3265,623.9486,518.13,633.39" style="stroke:#555555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="139.3471" x="541" y="580.637">passed to build-handle</text></g><!--link ctx to rt--><g class="link" data-entity-1="ent0007" data-entity-2="ent0009" data-link-type="dependency" data-source-line="30" id="lnk16"><path d="M667.55,535.88 C674.69,544.92 681.1,555.07 685,565.74 C701.62,611.23 747.37,556.93 655,735.02 C640.29,763.38 619.9365,786.2205 598.3765,806.2105" fill="none" id="ctx-to-rt" style="stroke:#555555;stroke-width:1;"/><polygon fill="#555555" points="594.71,809.61,604.0293,806.4241,598.3765,806.2105,598.5901,800.5577,594.71,809.61" style="stroke:#555555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="115.5701" x="710.57" y="659.277">same fields passed</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="70.0181" x="733.346" y="676.983">positionally</text></g><!--link step5 to rt--><g class="link" data-entity-1="ent0006" data-entity-2="ent0009" data-link-type="dependency" data-source-line="31" id="lnk17"><path d="M298.22,711.44 C354.29,742.01 421.76,778.7867 474,807.2667" fill="none" id="step5-to-rt" style="stroke:#555555;stroke-width:1;"/><polygon fill="#555555" points="478.39,809.66,472.4027,801.84,474,807.2667,468.5734,808.864,478.39,809.66" style="stroke:#555555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="93.6651" x="430.7755" y="757.917">get-extensions,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="114.0361" x="420.59" y="775.623">activate-document</text></g></g></svg>