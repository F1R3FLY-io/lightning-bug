<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="728px" preserveAspectRatio="none" style="width:952px;height:728px;background:#FFFFFF;" version="1.1" viewBox="0 0 952 728" width="952px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><g class="title" data-source-line="16"><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="376.0667" x="284.7817" y="24.9659">CI and Release &#8212; job DAG (.github/workflows/ci.yaml)</text></g><!--entity lint--><g class="entity" data-qualified-name="lint" data-source-line="18" id="ent0001"><rect fill="#6FB2B0" height="77.2038" rx="5" ry="5" style="stroke:#333333;stroke-width:0.5;" width="274.869" x="470.99" y="47.8779"/><text fill="#10223A" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="129.1495" x="480.99" y="72.8439">lint-and-test-types</text><text fill="#10223A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="254.869" x="480.99" y="91.9118">lint (clj-kondo &#183; eastwood &#183; splint &#183; kibit)</text><text fill="#10223A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="206.4152" x="480.99" y="110.9797">+ test:types + check:demo-deps</text></g><!--entity bench--><g class="entity" data-qualified-name="bench" data-source-line="19" id="ent0002"><rect fill="#E8A33D" height="77.2038" rx="5" ry="5" style="stroke:#333333;stroke-width:0.5;" width="292.8449" x="7" y="186.8879"/><text fill="#10223A" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="79.6037" x="17" y="211.8539">benchmark</text><text fill="#10223A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="262.6235" x="17" y="230.9218">base vs head &#8594; compare-benchmarks.js</text><text fill="#10223A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="272.8449" x="17" y="249.9897">--gate-regression 150   (pull_request only)</text></g><!--entity formal--><g class="entity" data-qualified-name="formal" data-source-line="20" id="ent0003"><rect fill="#C0504D" height="77.2038" rx="5" ry="5" style="stroke:#333333;stroke-width:0.5;" width="247.9331" x="334.46" y="186.8879"/><text fill="#10223A" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="131.2355" x="344.46" y="211.8539">formal-verification</text><text fill="#10223A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="227.9331" x="344.46" y="230.9218">verify:formal:ci = alignment + Rocq</text><text fill="#10223A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="154.2374" x="344.46" y="249.9897">(installs Rocq via opam)</text></g><!--entity test--><g class="entity" data-qualified-name="test" data-source-line="21" id="ent0004"><rect fill="#4F86C6" height="77.2038" rx="5" ry="5" style="stroke:#333333;stroke-width:0.5;" width="282.527" x="617.16" y="186.8879"/><text fill="#10223A" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="27.5379" x="627.16" y="211.8539">test</text><text fill="#10223A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.483" x="627.16" y="230.9218">matrix: OS x browser x {debug, release}</text><text fill="#10223A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="262.527" x="627.16" y="249.9897">Karma tests + demo sanity + libs artifact</text></g><!--entity release--><g class="entity" data-qualified-name="release" data-source-line="22" id="ent0005"><rect fill="#5FA55A" height="77.2038" rx="5" ry="5" style="stroke:#333333;stroke-width:0.5;" width="264.0891" x="626.38" y="324.0979"/><text fill="#10223A" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="50.9178" x="636.38" y="349.0639">release</text><text fill="#10223A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="244.0891" x="636.38" y="368.1318">download libs artifact -&gt; npm publish</text><text fill="#10223A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="120.1195" x="636.38" y="387.1997">(GitHub Packages)</text></g><g class="entity" data-qualified-name="GMN12" data-source-line="33" id="ent0013"><path d="M23.9,51.0679 L23.9,121.892 A5,5 0 0 0 28.9,126.892 L149.42,126.892 L153.42,186.8379 L157.42,126.892 L277.9432,126.892 A5,5 0 0 0 282.9432,121.892 L282.9432,56.0679 L272.9432,46.0679 L28.9,46.0679 A5,5 0 0 0 23.9,51.0679" fill="#EDEFF2" style="stroke:#7A8797;stroke-width:0.5;"/><path d="M272.9432,46.0679 L272.9432,53.5679 A2.5,2.5 0 0 0 275.4432,56.0679 L282.9432,56.0679 L272.9432,46.0679" fill="#EDEFF2" style="stroke:#7A8797;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="161.2782" x="29.9" y="64.9649">Runs only on pull_request.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="169.9102" x="29.9" y="82.6709">Fails only on a &gt; 150% (2.5x)</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="169.5852" x="29.9" y="100.377">regression; the full report is</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="238.0432" x="29.9" y="118.083">posted to the run summary either way.</text></g><g class="entity" data-qualified-name="GMN15" data-source-line="40" id="ent0016"><path d="M641.56,466.2979 L641.56,554.828 A5,5 0 0 0 646.56,559.828 L870.2922,559.828 A5,5 0 0 0 875.2922,554.828 L875.2922,471.2979 L865.2922,461.2979 L762.42,461.2979 L758.42,401.6379 L754.42,461.2979 L646.56,461.2979 A5,5 0 0 0 641.56,466.2979" fill="#EDEFF2" style="stroke:#7A8797;stroke-width:0.5;"/><path d="M865.2922,461.2979 L865.2922,468.7979 A2.5,2.5 0 0 0 867.7922,471.2979 L875.2922