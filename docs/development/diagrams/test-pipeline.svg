<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="649px" preserveAspectRatio="none" style="width:427px;height:649px;background:#FFFFFF;" version="1.1" viewBox="0 0 427 649" width="427px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><g class="title" data-source-line="12"><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="385.6985" x="20" y="34.9659">npm test &#8212; sequential gate chain (stops at first failure)</text></g><ellipse cx="128.252" cy="65.0679" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#5FA55A" height="69.0323" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:0.5;" width="206.7213" x="24.8914" y="95.0679"/><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="59.8084" x="34.8914" y="117.896">test:types</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="168.4572" x="34.8914" y="134.2401">tsd validates the hand-written</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="186.7213" x="34.8914" y="150.5842">TypeScript bindings (types/*.d.ts)</text><rect fill="#5FA55A" height="69.0323" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:0.5;" width="184.0412" x="36.2314" y="184.1003"/><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="64.6925" x="46.2314" y="206.9283">test:debug</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="164.0412" x="46.2314" y="223.2725">Karma runs 516 tests against</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="148.057" x="46.2314" y="239.6166">the :none (debug) compile</text><rect fill="#5FA55A" height="69.0323" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:0.5;" width="197.9733" x="29.2654" y="273.1326"/><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="70.6205" x="39.2654" y="295.9607">test:release</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="164.0412" x="39.2654" y="312.3048">Karma runs 516 tests against</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="177.9733" x="39.2654" y="328.6489">the :advanced (release) compile</text><rect fill="#4F86C6" height="69.0323" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:0.5;" width="181.1611" x="37.6714" y="362.1649"/><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="67.4525" x="47.6714" y="384.993">build:demo</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="90.5886" x="118.2439" y="384.993">(MODE=release)</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="135.145" x="47.6714" y="401.3371">shadow-cljs release :libs</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="110.4488" x="47.6714" y="417.6813">+ copy demo assets</text><rect fill="#6FB2B0" height="69.0323" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:0.5;" width="209.9974" x="23.2533" y="451.1973"/><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="60.9244" x="33.2533" y="474.0254">test:demo</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="189.9974" x="33.2533" y="490.3695">headless browser loads the demo</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="158.2332" x="33.2533" y="506.7136">and asserts the Editor boots</text><path d="M159.252,530.2296 L159.252,575.4947 L139.252,579.4947 L159.252,583.4947 L159.252,628.7597 A0,0 0 0 0 159.252,628.7597 L399.4452,628.7597 A0,0 0 0 0 399.4452,628.7597 L399.4452,540.2296 L389.4452,530.2296 L159.252,530.2296 A0,0 0 0 0 159.252,530.2296" fill="#FBF6DD" style="stroke:#B0A15A;stroke-width:0.5;"/><path d="M389.4452,530.2296 L389.4452,540.2296 L399.4452,540.2296 L389.4452,530.2296" fill="#FBF6DD" style="stroke:#B0A15A;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="219.1932" x="165.252" y="549.1266">npm test is A &amp;&amp; B &amp;&amp; C &amp;&amp; D &amp;&amp; E,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="209.0012" x="165.252" y="566.8327">so a failing stage aborts the chain.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="135.3561" x="165.252" y="584.5387">Local default browser:</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="175.3051" x="165.252" y="602.2447">ChromeHeadlessNoSandbox</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="214.2402" x="165.252" y="619.9507">(override with KARMA_BROWSERS).</text><ellipse cx="128.252" cy="579.4947" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="128.252" cy="579.4947" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#555555;stroke-width:1;" x1="128.252" x2="128.252" y1="75.0679" y2="95.0679"/><polygon fill="#555555" points="124.252,85.0679,128.252,95.0679,132.252,85.0679,128.252,89.0679" style="stroke:#555555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#555555;stroke-width:1;" x1="128.252" x2="128.252" y1="164.1003" y2="184.1003"/><polygon fill="#555555" points="124.252,174.1003,128.252,184.1003,1