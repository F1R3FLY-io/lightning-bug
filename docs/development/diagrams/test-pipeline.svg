<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="720px" preserveAspectRatio="none" style="width:575px;height:720px;background:#FFFFFF;" version="1.1" viewBox="0 0 575 720" width="575px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><g class="title" data-source-line="12"><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="385.6985" x="93.6507" y="34.9659">npm test &#8212; sequential gate chain (stops at first failure)</text></g><rect fill="#FFFFCC" height="65.86" rx="2.5" ry="2.5" style="stroke:#FFDD88;stroke-width:3;" width="544" x="13" y="53.0679"/><text fill="#000000" font-family="monospace" font-size="10" lengthAdjust="spacing" textLength="534" x="20" y="65.6879">This&#160;syntax&#160;is&#160;deprecated,&#160;you&#160;must&#160;add&#160;&lt;&lt;#5FA55A&gt;&gt;&#160;at&#160;the&#160;end&#160;of&#160;the&#160;line,&#160;after&#160;the&#160;';'</text><text fill="#000000" font-family="monospace" font-size="10" lengthAdjust="spacing" textLength="534" x="20" y="89.3079">This&#160;syntax&#160;is&#160;deprecated,&#160;you&#160;must&#160;add&#160;&lt;&lt;#4F86C6&gt;&gt;&#160;at&#160;the&#160;end&#160;of&#160;the&#160;line,&#160;after&#160;the&#160;';'</text><text fill="#000000" font-family="monospace" font-size="10" lengthAdjust="spacing" textLength="534" x="20" y="112.9279">This&#160;syntax&#160;is&#160;deprecated,&#160;you&#160;must&#160;add&#160;&lt;&lt;#6FB2B0&gt;&gt;&#160;at&#160;the&#160;end&#160;of&#160;the&#160;line,&#160;after&#160;the&#160;';'</text><ellipse cx="120.9987" cy="135.9279" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="69.0323" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:0.5;" width="206.7213" x="17.638" y="165.9279"/><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="59.8084" x="27.638" y="188.756">test:types</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="168.4572" x="27.638" y="205.1001">tsd validates the hand-written</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="186.7213" x="27.638" y="221.4442">TypeScript bindings (types/*.d.ts)</text><rect fill="#F1F1F1" height="69.0323" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:0.5;" width="184.0412" x="28.9781" y="254.9602"/><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="64.6925" x="38.9781" y="277.7883">test:debug</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="164.0412" x="38.9781" y="294.1324">Karma runs 516 tests against</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="148.057" x="38.9781" y="310.4765">the :none (debug) compile</text><rect fill="#F1F1F1" height="69.0323" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:0.5;" width="197.9733" x="22.0121" y="343.9926"/><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="70.6205" x="32.0121" y="366.8207">test:release</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="164.0412" x="32.0121" y="383.1648">Karma runs 516 tests against</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="177.9733" x="32.0121" y="399.5089">the :advanced (release) compile</text><rect fill="#F1F1F1" height="69.0323" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:0.5;" width="181.1611" x="30.4181" y="433.0249"/><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="67.4525" x="40.4181" y="455.853">build:demo</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="90.5886" x="110.9906" y="455.853">(MODE=release)</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="135.145" x="40.4181" y="472.1971">shadow-cljs release :libs</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="110.4488" x="40.4181" y="488.5412">+ copy demo assets</text><rect fill="#F1F1F1" height="69.0323" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:0.5;" width="209.9974" x="16" y="522.0573"/><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="60.9244" x="26" y="544.8853">test:demo</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="189.9974" x="26" y="561.2295">headless browser loads the demo</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="158.2332" x="26" y="577.5736">and asserts the Editor boots</text><path d="M151.9987,601.0896 L151.9987,646.3546 L131.9987,650.3546 L151.9987,654.3546 L151.9987,699.6197 A0,0 0 0 0 151.9987,699.6197 L392.1919,699.6197 A0,0 0 0 0 392.1919,699.6197 L392.1919,611.0896 L382.1919,601.0896 L151.9987,601.0896 A0,0 0 0 0 151.9987,601.0896" fill="#FBF6DD" style="stroke:#B0A15A;stroke-width:0.5;"/><path d="M382.1919,601.0896 L382.1919,611.0896 L392.1919,611.0896 L382.1919,601.0896" fill="#FBF6DD" style="stroke:#B0A15A;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="219.1932" x="157.9987" y="619.9866">npm test is A &amp;&amp; B &amp;&amp; C &amp;&amp; D &amp;&amp; E,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="209.0012" x="157.9987" y="637.6926">so a failing stage aborts the chain.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="135.3561" x="157.9987" y="655.3986">Local default browser:</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="175.3051" x="157.9987" y="673.1047">ChromeHeadlessNoSandbox</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="214.2402" x="157.9987" y="690.8107">(override with KARMA_BROWSERS).</text><ellipse cx="120.9987" cy="650.3546" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="120.9987" cy="650.3546" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#555555;stroke-width:1;" x1="120.9987" x2="120.9987" y1="145.9279" y2="165.9279"/><polygon fill="#555555" points="116.9987,155.9279,120.9987,165.9279,124.9987,155.9279,120.9987,159.9279" style="stroke:#555555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#555555;stroke-width:1;" x1="120.9987" x2="120.9987" y1="234.9602" y2="254.9602"/><polygon fill="#555555" points="116.9987,244.9602,120.9987,254.9602,124.9987,244.9602,120.9987,248.9602" style="stroke:#555555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#555555;stroke-width:1;" x1="120.9987" x2="120.9987" y1="323.9926" y2="343.9926"/><polygon fill="#555555" points="116.9987,333.9926,120.9987,343.9926,124.9987,333.9926,120.9987,337.9926" style="stroke:#555555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#555555;stroke-width:1;" x1="120.9987" x2="120.9987" y1="413.0249" y2="433.0249"/><polygon fill="#555555" points="116.9987,423.0249,120.9987,433.0249,124.9987,423.0249,120.9987,427.0249" style="stroke:#555555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#555555;stroke-width:1;" x1="120.9987" x2="120.9987" y1="502.0573" y2="522.0573"/><polygon fill="#555555" points="116.9987,512.0573,120.9987,522.0573,124.9987,512.0573,120.9987,516.0573" style="stroke:#555555;stroke-wid